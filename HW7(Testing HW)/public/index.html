<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="CampusFlow 學生課程任務管理系統"><title>CampusFlow｜課程任務管理</title><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script></head>
<body><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><div class="app-shell">
<aside class="sidebar"><a class="brand" href="#" aria-label="CampusFlow 首頁"><span class="brand-mark">C</span><span>Campus<span>Flow</span></span></a><nav aria-label="主要選單"><a class="nav-item active" href="#dashboard"><span>◫</span>任務儀表板</a><a class="nav-item" href="#new-task"><span>＋</span>建立新任務</a></nav><div class="sidebar-note"><span class="note-icon">✦</span><strong>保持你的節奏</strong><p>把每份作業拆成可完成的一小步。</p></div><p class="sidebar-footer">HW7 · Software Testing</p></aside>
<main><header class="topbar" id="dashboard"><div><p class="eyebrow">STUDENT WORKSPACE</p><h1>今天也一起前進吧！</h1><p class="subtitle">集中管理課程任務，讓每個截止日都從容可控。</p></div><div class="date-chip" id="today"></div></header>
<section class="stats" aria-label="任務統計"><article class="stat-card purple"><div class="stat-icon">▦</div><div><p>總任務</p><strong id="total-count">0</strong><span>所有課程任務</span></div></article><article class="stat-card amber"><div class="stat-icon">◷</div><div><p>待完成</p><strong id="pending-count">0</strong><span>繼續保持專注</span></div></article><article class="stat-card green"><div class="stat-icon">✓</div><div><p>已完成</p><strong id="completed-count">0</strong><span>做得很棒！</span></div></article><article class="stat-card rose"><div class="stat-icon">⌁</div><div><p>即將到期</p><strong id="due-soon-count">0</strong><span>未來 7 天內</span></div></article></section>
<section class="content-grid"><article class="panel form-panel" id="new-task"><div class="panel-heading"><div><p class="eyebrow">QUICK ADD</p><h2>新增課程任務</h2></div><span class="heading-icon">＋</span></div><form id="task-form" novalidate>
<label for="course">課程名稱</label><input id="course" name="course" placeholder="例如：網路概論" autocomplete="off"><p class="field-error" id="course-error"></p>
<label for="title">任務名稱</label><input id="title" name="title" placeholder="例如：完成第七週作業" autocomplete="off"><p class="field-error" id="title-error"></p>
<div class="form-row"><div><label for="dueDate">截止日期</label><input id="dueDate" name="dueDate" type="date"><p class="field-error" id="dueDate-error"></p></div><div><label for="priority">優先程度</label><select id="priority" name="priority"><option value="low">低</option><option value="medium" selected>中</option><option value="high">高</option></select></div></div><button class="primary-button" type="submit"><span>＋</span>新增任務</button></form></article>
<article class="panel tasks-panel"><div class="panel-heading tasks-heading"><div><p class="eyebrow">MY TASKS</p><h2>任務清單</h2></div><div class="filters" role="group" aria-label="篩選任務"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="pending">待完成</button><button class="filter" data-filter="completed">已完成</button></div></div><div id="task-list" class="task-list" aria-live="polite"></div></article></section></main></div><div id="toast" class="toast" role="status" aria-live="polite"></div></body></html>
